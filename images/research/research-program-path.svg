<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Four questions in Chau Tong's research program</title>
  <desc id="desc">A four stage pathway. People: who produces and shares information? Platform and social curation: what becomes visible, amplified, or hidden? Information: what do people encounter and how can it be measured? Impact: how does information relate to understanding and action?</desc>
  <style>
    .number { fill: #c94a3d; font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
    .head { fill: #18364a; font: 700 42px Georgia, 'Times New Roman', serif; }
    .body { fill: #26343c; font: 500 30px Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #d8d1c4; stroke-width: 2; }
    .rule { fill: #c94a3d; }
    .path { fill: none; stroke: #c94a3d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .node { fill: #f7f3ea; stroke: #c94a3d; stroke-width: 4; }
  </style>
  <rect width="1200" height="640" fill="#ffffff"/>

  <rect class="card" x="35" y="35" width="520" height="245"/>
  <rect class="rule" x="35" y="35" width="118" height="6"/>
  <text class="number" x="70" y="83">01 / PEOPLE</text>
  <text class="head" x="70" y="137">People</text>
  <text class="body" x="70" y="194"><tspan x="70">Who produces and</tspan><tspan x="70" dy="40">shares information?</tspan></text>

  <rect class="card" x="645" y="35" width="520" height="245"/>
  <rect class="rule" x="645" y="35" width="118" height="6"/>
  <text class="number" x="680" y="83">02 / CURATION</text>
  <text class="head" x="680" y="128"><tspan x="680">Platform and</tspan><tspan x="680" dy="45">social curation</tspan></text>
  <text class="body" x="680" y="220"><tspan x="680">What becomes visible,</tspan><tspan x="680" dy="38">amplified, or hidden?</tspan></text>

  <rect class="card" x="35" y="360" width="520" height="245"/>
  <rect class="rule" x="35" y="360" width="118" height="6"/>
  <text class="number" x="70" y="408">03 / INFORMATION</text>
  <text class="head" x="70" y="462">Information</text>
  <text class="body" x="70" y="519"><tspan x="70">What do people encounter,</tspan><tspan x="70" dy="40">and how can it be measured?</tspan></text>

  <rect class="card" x="645" y="360" width="520" height="245"/>
  <rect class="rule" x="645" y="360" width="118" height="6"/>
  <text class="number" x="680" y="408">04 / IMPACT</text>
  <text class="head" x="680" y="462">Impact</text>
  <text class="body" x="680" y="519"><tspan x="680">How does information relate to</tspan><tspan x="680" dy="40">understanding and action?</tspan></text>

  <path class="path" d="M555 158 H645"/>
  <circle class="node" cx="600" cy="158" r="10"/>
  <path class="path" d="M905 280 V320 H295 V360"/>
  <circle class="node" cx="905" cy="320" r="10"/>
  <path class="path" d="M555 483 H645"/>
  <circle class="node" cx="600" cy="483" r="10"/>
</svg>
