<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" role="img" aria-labelledby="title desc">
  <title id="title">Four questions in Chau Tong's research program</title>
  <desc id="desc">A from top to bottom pathway adapted from a 2026 research colloquium slide. People: who produces and shares information? Platform and social curation: what becomes visible, amplified, or hidden? Information: what do people encounter and how can it be measured? Impact: how does information relate to understanding and action?</desc>
  <style>
    .head { fill: #18364a; font: 700 34px 'Source Sans Pro', Arial, sans-serif; }
    .body { fill: #26343c; font: 400 29px 'Source Sans Pro', Arial, sans-serif; }
    .rule { fill: #c94a3d; }
    .arrow { fill: none; stroke: #c94a3d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="680" height="760" fill="#ffffff"/>
  <rect class="rule" x="40" y="20" width="600" height="5"/>
  <text class="head" x="40" y="74">People</text>
  <text class="body" x="40" y="119">Who produces and shares information?</text>
  <path class="arrow" d="M340 139v27m-9-9 9 9 9-9"/>
  <rect class="rule" x="40" y="189" width="600" height="5"/>
  <text class="head" x="40" y="243">Platform and social curation</text>
  <text class="body" x="40" y="288"><tspan x="40">What becomes visible, amplified,</tspan><tspan x="40" dy="35">or hidden?</tspan></text>
  <path class="arrow" d="M340 345v27m-9-9 9 9 9-9"/>
  <rect class="rule" x="40" y="395" width="600" height="5"/>
  <text class="head" x="40" y="449">Information</text>
  <text class="body" x="40" y="494"><tspan x="40">What do people encounter,</tspan><tspan x="40" dy="35">and how can I measure it?</tspan></text>
  <path class="arrow" d="M340 551v27m-9-9 9 9 9-9"/>
  <rect class="rule" x="40" y="601" width="600" height="5"/>
  <text class="head" x="40" y="655">Impact</text>
  <text class="body" x="40" y="700"><tspan x="40">How does information relate to</tspan><tspan x="40" dy="35">understanding and action?</tspan></text>
</svg>
